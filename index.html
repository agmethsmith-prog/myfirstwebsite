<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cuadrículas Bootstrap</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        /* Estilos generales */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        /* Estilos para las cajas */
        [class^="caja"] {
            border: 2px solid black;
            box-sizing: border-box;
            text-align: center;
            padding: 10px;
            color: black;
            font-weight: bold;
        }

        .caja1 {
            background-color: #ff9999;
            height: 100px;
        }

        .caja2 {
            background-color: #99ccff;
            height: 100px;
        }

        .caja3 {
            background-color: #99ff99;
            height: 100px;
        }

        .caja4 {
            background-color: #ffff99;
            height: 100px;
        }

        .caja5 {
            background-color: #ffcc99;
            height: 100px;
        }

        .caja6 {
            background-color: #cc99ff;
            height: 100px;
        }

        .caja7 {
            background-color: #99ffff;
            height: 100px;
        }

        .caja8 {
            background-color: #ff99cc;
            height: 100px;
        }

        .caja9 {
            background-color: #cccccc;
            height: 100px;
        }

        .caja10 {
            background-color: #FABF00;
            height: 200px;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <!-- g-3 separa las cajas horizontal y verticalmente -->
        <div class="row g-3">

            <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-12">
                <div class="caja1">Caja 1</div>
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3">
                <div class="caja2">Caja 2</div>
            </div>

            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-3">
                <div class="caja3">Caja 3</div>
            </div>

            <div class="col-6 col-sm-6 col-md-12 col-lg-12 col-xl-3">
                <div class="caja4">Caja 4</div>
            </div>

            <div class="col-6 col-sm-6 col-md-12 col-lg-12 col-xl-3">
                <div class="caja5">Caja 5</div>
            </div>

            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-12">
                <div class="caja6">Caja 6</div>
            </div>

            <div class="col-6 col-sm-6 col-md-4 col-lg-4 col-xl-3">
                <div class="caja7">Caja 7</div>
            </div>

            <div class="col-6 col-sm-6 col-md-12 col-lg-12 col-xl-3">
                <div class="caja8">Caja 8</div>
            </div>

            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-3">
                <div class="caja9">Caja 9</div>
            </div>

            <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-3">
                <div class="caja10">Caja 10</div>
            </div>

        </div>
    </div>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
